<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VaultX Password Manager</title>
<style>
:root{--bg:#0b0b0f;--card:#17171d;--card2:#1f1f27;--tx:#f2f2f5;--mut:#8b8b98;--a:#7c5cff;--b:#22d3ee;--r:20px}
[data-t=mono]{--a:#8a8a94;--b:#f4f4f6}
[data-t=violet]{--a:#7c5cff;--b:#22d3ee}
[data-t=sunset]{--a:#ff5e62;--b:#ff9966}
[data-t=ocean]{--a:#2193b0;--b:#6dd5ed}
[data-t=emerald]{--a:#11998e;--b:#38ef7d}
[data-t=rose]{--a:#ee0979;--b:#ff6a00}
[data-t=aurora]{--a:#8e2de2;--b:#00c9ff}
[data-t=gold]{--a:#f7971e;--b:#ffd200}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:radial-gradient(120% 50% at 50% -10%,color-mix(in srgb,var(--a) 45%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
.wrap{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px 0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--card);border:1px solid #ffffff14;border-radius:14px;padding:13px 14px;outline:0;margin:5px 0 10px}
input:focus,select:focus,textarea:focus{border-color:var(--a)}
select option{background:#17171d}
label{color:var(--mut);font-size:12px;margin-left:4px}
.btn{border:0;border-radius:16px;padding:14px 18px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:600;cursor:pointer;width:100%}
.btn.g{background:var(--card2);color:var(--tx)}.btn.d{background:#3a1519;color:#ff7b86}
.btn.s{width:auto;padding:9px 14px;font-size:13px;border-radius:12px}
h1{font-size:34px;line-height:1.1;margin:0}
.grad{background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
#lock{max-width:420px;margin:0 auto;height:100dvh;padding:0 24px;display:flex;flex-direction:column;justify-content:center;gap:6px}
#err{color:#ff7b86;min-height:20px;font-size:13px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 8px}
header h2{margin:0;font-size:24px}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid #ffffff14;background:var(--card);cursor:pointer;font-size:17px}
main{flex:1;overflow-y:auto;padding-bottom:150px;scrollbar-width:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid #ffffff10;cursor:pointer;font-size:13px;color:var(--mut)}
.chip.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:0}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:10px;cursor:pointer;border:1px solid #ffffff0a}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:18px;background:linear-gradient(135deg,var(--a),var(--b));flex:none}
.inf{flex:1;min-width:0}.inf b,.inf small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
small,.mut{color:var(--mut)}
.row{display:flex;gap:6px}
.sm{width:36px;height:36px;border-radius:12px;border:0;background:var(--card2);cursor:pointer}
.box{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid #ffffff0a}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:6px;padding:8px;border-radius:99px;background:#17171dd9;backdrop-filter:blur(14px);border:1px solid #ffffff14;width:min(92vw,400px);justify-content:space-around}
nav button{flex:1;border:0;background:0;border-radius:99px;padding:10px 0;font-size:19px;cursor:pointer;opacity:.55}
nav button.on{opacity:1;background:linear-gradient(135deg,var(--a),var(--b))}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(88px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;font-size:30px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 24px #0008;cursor:pointer}
.sh{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh>div{background:#121217;width:100%;max-width:520px;max-height:92dvh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.bar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:.3s}
.pwd{font:600 18px ui-monospace,Menlo,monospace;word-break:break-all;padding:14px;background:var(--card2);border-radius:14px;margin-bottom:12px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.sw i{width:38px;height:38px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw i.on{border-color:#fff}
.chk{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.chk input{width:auto;margin:0;accent-color:var(--a)}
#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:#fff;color:#000;padding:11px 18px;border-radius:99px;font-weight:600;transition:.3s;z-index:20}
#toast.on{transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mut);padding:50px 0}

:root{--bt:#fff}
[data-t=mono]{--a:#b9b9c2;--b:#ffffff;--bt:#111}
body{background:radial-gradient(130% 45% at 50% -8%,color-mix(in srgb,var(--a) 55%,transparent),transparent 72%),var(--bg);background-attachment:fixed}
.btn,.chip.on,nav button.on,#toast{color:var(--bt)}
.btn{border-radius:99px;box-shadow:inset 0 1px 0 #fff6,0 6px 18px #0006}
.btn.g{color:var(--tx);box-shadow:inset 0 1px 0 #ffffff14}.btn.d{box-shadow:none}
#lock{max-width:none;padding:0 max(26px,calc(50% - 210px)) 34px;justify-content:flex-end;position:relative;background:linear-gradient(180deg,#c4c4cb 0,#55555c 22%,#0b0b0f 58%);overflow:hidden}
#lock:before{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff0d 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,#ffffff0d 1px,transparent 1px) 0 0/44px 44px;-webkit-mask:linear-gradient(#000,transparent 70%);mask:linear-gradient(#000,transparent 70%)}
#lock>*{position:relative}
.brand{position:absolute!important;top:calc(24px + env(safe-area-inset-top));font-weight:600;color:#111;font-size:17px}
#lock h1{font-size:46px;font-weight:300;color:#9a9aa3;letter-spacing:-1px;margin-bottom:10px}#lock h1 b{color:#fff;font-weight:400}
.hero{font-size:44px;font-weight:300;letter-spacing:-1.5px;margin:6px 0 18px}
.ip{display:inline-grid;place-items:center;font-style:normal;font-size:22px;height:44px;min-width:56px;padding:0 10px;border-radius:99px;background:#000;border:1px solid #ffffff1a;vertical-align:middle;filter:grayscale(1);letter-spacing:0}
.srch{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#1d1d22,#141418);border:1px solid #ffffff12;border-radius:99px;padding:4px 8px 4px 18px;margin-bottom:14px}
.srch input{background:0;border:0;margin:0;padding:11px 4px}.srch button{border:0;background:0;font-size:18px;cursor:pointer;filter:grayscale(1)}
.item,.box,.pill{background:linear-gradient(180deg,#1d1d22,#121216);border:1px solid #ffffff12;box-shadow:inset 0 1px 0 #ffffff10;border-radius:26px}
.pill{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:6px;cursor:pointer;border-radius:99px;background:linear-gradient(180deg,#26262c,#0e0e11)}
.av{background:#000;border:1px solid #ffffff1c;color:var(--tx);border-radius:50%;position:relative;filter:grayscale(.2)}
.bd{position:absolute;top:-4px;right:-4px;background:#fff;color:#000;font:700 11px system-ui;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 12px}.sec a{color:var(--mut);font-size:13px;cursor:pointer}
.sm{border-radius:50%;background:#000;border:1px solid #ffffff14;filter:grayscale(1)}
.item.sub{margin:-2px 0 10px 26px;padding:10px 14px;border-radius:18px;background:#0e0e11}
.bar{background:#1a1a1f;height:14px}.bar.big{height:26px;border-radius:99px;border:1px solid #ffffff12}.bar i{border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b))}
.glass{display:flex;gap:12px;align-items:center;padding:18px;margin-bottom:14px;border-radius:28px;background:radial-gradient(90% 120% at 90% 0,#ffffff30,transparent 60%),#16161a;border:1px solid #ffffff18}
.glass .btn{width:auto;padding:8px 18px;font-size:13px}
nav{gap:8px;padding:8px;background:#0f0f13cc;box-shadow:0 10px 30px #000a}
nav button{width:50px;height:50px;flex:none;padding:0;filter:grayscale(1);background:linear-gradient(180deg,#26262c,#131317);opacity:.9;border:1px solid #ffffff12}
nav button.on,nav .plus{background:linear-gradient(180deg,#fff,#aaa);filter:grayscale(1) brightness(.2);opacity:1;color:#000}
nav{justify-content:center}
.fab{display:none}
.chip{background:#17171c}
.chip.on{background:linear-gradient(135deg,var(--a),var(--b))}
.sw i.on{border-color:var(--tx)}
</style></head><body>

<div id="lock">
  <div class="brand">🔐 VaultX</div>
  <h1>Your Passwords,<br><b>Safely Secured</b></h1>
  <p class="mut" id="lsub"></p>
  <input id="mp" type="password" placeholder="Master password" autocomplete="off">
  <input id="mp2" type="password" placeholder="Confirm master password" hidden autocomplete="off">
  <div id="err"></div>
  <button class="btn" id="go">Get Started</button>
  <small class="mut" style="text-align:center;margin-top:10px">Encrypted AES-256 • stored only on this device</small>
</div>

<div class="wrap" id="app" hidden>
  <header><h2>Vault<span class="grad">X</span></h2><div class="row"><button class="ib" id="inst" hidden title="Install">⬇</button><button class="ib" onclick="lockNow()" title="Lock">🔒</button></div></header>
  <main id="view"></main>
  <button class="fab" id="fab" onclick="edit()">+</button>
  <nav id="nav"></nav>
</div>
<div class="sh" id="sh" hidden onclick="if(event.target===this)closeSh()"><div id="shc"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept=".json,.vaultx" hidden>

<script>
const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=b=>{let s='';for(const x of new Uint8Array(b))s+=String.fromCharCode(x);return btoa(s)};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(p,salt){const m=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(o,p){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(p,salt),enc.encode(JSON.stringify(o)));return{s:b64(salt),i:b64(iv),d:b64(ct)}}
async function unseal(o,p){return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.i)},await key(p,ub(o.s)),ub(o.d))))}

let items=[],pw='',tab='vault',q='',cat='All',lt,dp,sf=0,hs='';
const CATS=['Social','Work','Finance','Shopping','Email','Other'];
const S=JSON.parse(localStorage.getItem('vx_set')||'{}');
const setS=(k,v)=>{S[k]=v;localStorage.setItem('vx_set',JSON.stringify(S))};
const theme=t=>{document.documentElement.dataset.t=t;setS('theme',t)};
theme(S.theme||'mono');
const G={len:16,u:1,l:1,n:1,s:1};
function gen(){let c='';if(G.l)c+='abcdefghjkmnpqrstuvwxyz';if(G.u)c+='ABCDEFGHJKLMNPQRSTUVWXYZ';if(G.n)c+='23456789';if(G.s)c+='!@#$%^&*-_?+=';if(!c)c='abcdefghjkmnpqrstuvwxyz';return[...crypto.getRandomValues(new Uint32Array(G.len))].map(x=>c[x%c.length]).join('')}
const score=p=>{let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^\w]/.test(p))s++;return Math.min(s,4)};
const SL=['Very weak','Weak','Fair','Good','Strong'];
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
function copy(t,l){navigator.clipboard.writeText(t).then(()=>{toast(l+' copied'+(S.cc!==0?' • clears in 30s':''));if(S.cc!==0)setTimeout(()=>navigator.clipboard.writeText('').catch(()=>{}),30000)}).catch(()=>toast('Copy blocked'))}
async function save(){localStorage.setItem('vx_v',JSON.stringify(await seal(items,pw)))}

// ---- lock ----
const V=()=>JSON.parse(localStorage.getItem('vx_v')||'null');
function lockUI(){const n=!V();$('#lsub').textContent=n?'Create a master password. Do not forget it — it cannot be recovered.':'Enter your master password to unlock.';$('#mp2').hidden=!n;$('#go').textContent=n?'Create Vault':'Unlock';$('#mp').value=$('#mp2').value='';$('#err').textContent=''}
$('#go').onclick=async()=>{const p=$('#mp').value,v=V(),e=m=>$('#err').textContent=m;
 try{if(!v){if(p.length<6)return e('Minimum 6 characters');if(p!==$('#mp2').value)return e('Passwords do not match');pw=p;items=[];await save()}else{items=await unseal(v,p);pw=p}}catch(x){return e('Wrong password')}
 $('#lock').hidden=true;$('#app').hidden=false;tab='vault';render();bump()};
$('#mp').onkeydown=$('#mp2').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
function lockNow(){pw='';items=[];closeSh();$('#app').hidden=true;$('#lock').hidden=false;lockUI()}
function bump(){clearTimeout(lt);const m=S.al??5;if(m>0&&pw)lt=setTimeout(lockNow,m*60000)}
['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>pw&&bump()));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&pw&&S.hl)lockNow()});

// ---- sheets ----
function openSh(h){$('#shc').innerHTML=h;$('#sh').hidden=false}
function closeSh(){$('#sh').hidden=true;$('#shc').innerHTML=''}
function askPw(msg,verify=true){return new Promise(r=>{openSh(`<h3 style="margin-top:0">🔑 ${esc(msg)}</h3><input id="ap" type="password" placeholder="Master password"><div id="ae" style="color:#ff7b86;min-height:18px;font-size:13px"></div><div class="row"><button class="btn g" id="ac">Cancel</button><button class="btn" id="ao">Confirm</button></div>`);
 const ok=()=>{const v=$('#ap').value;if(verify&&v!==pw){$('#ae').textContent='Wrong password';return}closeSh();r(v)};
 $('#ao').onclick=ok;$('#ap').onkeydown=e=>{if(e.key==='Enter')ok()};$('#ac').onclick=()=>{closeSh();r(null)};$('#ap').focus()})}

// ---- vault ----
function render(){
 $('#fab').hidden=tab!=='vault';
 $('#nav').innerHTML=[['vault','🏠'],['gen','🎲'],['health','🛡'],['set','⚙']].map(([k,i])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${i}</button>`).join('')+'<button class="plus" onclick="edit()">＋</button>';
 const v=$('#view');
 if(tab==='vault'){v.innerHTML=`<h1 class="hero">Keep <i class="ip">🔑</i><br><i class="ip">＊＊</i> Your Life<br>Safe <i class="ip">🔒</i></h1><div class="srch"><span>🔍</span><input id="q" placeholder="Search ${items.length} items" value="${esc(q)}"><button onclick="sf=!sf;render()">🎚</button></div>${sf?`<div class="chips">${['All','★ Favorites',...CATS].map(c=>`<span class="chip ${cat===c?'on':''}" onclick="cat='${c}';render()">${c}</span>`).join('')}</div>`:''}<div class="pill" onclick="tab='gen';render()"><div class="av">✦</div><div class="inf"><b>Generate a strong password</b><small>Stay Safe, Stay Secure</small></div><span class="mut" style="margin-right:8px">›</span></div><div class="sec"><b>${cat==='All'?'All items':esc(cat)}</b><a onclick="cat='All';q='';sf=0;render()">See All</a></div><div id="list"></div>`;
  $('#q').oninput=e=>{q=e.target.value;list()};list()}
 else if(tab==='gen'){v.innerHTML=`<div class="box"><div class="pwd" id="gp"></div><div class="row"><button class="btn g" onclick="gp()">↻ New</button><button class="btn" onclick="copy($('#gp').textContent,'Password')">Copy</button></div></div>
  <div class="box"><label>Length: <b id="gl">${G.len}</b></label><input type="range" min="6" max="48" value="${G.len}" oninput="G.len=+this.value;$('#gl').textContent=this.value;gp()">
  ${[['u','Uppercase A-Z'],['l','Lowercase a-z'],['n','Numbers 0-9'],['s','Symbols !@#']].map(([k,t])=>`<div class="chk"><span>${t}</span><input type="checkbox" ${G[k]?'checked':''} onchange="G.${k}=this.checked?1:0;gp()"></div>`).join('')}</div>`;gp()}
 else if(tab==='health'){health()}
 else settings();
}
function gp(){const p=gen();$('#gp').textContent=p}
function list(){let a=items.filter(i=>(cat==='All'||(cat==='★ Favorites'?i.fav:i.cat===cat))&&(i.name+i.user+i.url).toLowerCase().includes(q.toLowerCase()));
 a.sort((x,y)=>(y.fav|0)-(x.fav|0)||x.name.localeCompare(y.name));
 $('#list').innerHTML=a.length?a.map(i=>`<div class="item" onclick="edit('${i.id}')"><div class="av">${esc((i.name[0]||'?').toUpperCase())}</div><div class="inf"><b>${i.fav?'★ ':''}${esc(i.name)}</b><small>${esc(i.user||i.url||'—')}</small></div><div class="row"><button class="sm" onclick="event.stopPropagation();cp('${i.id}','user')">👤</button><button class="sm" onclick="event.stopPropagation();cp('${i.id}','pass')">🔑</button></div></div>`).join(''):`<div class="empty">${items.length?'No match':'No passwords yet.<br>Tap + to add one.'}</div>`}
function cp(id,t){const i=items.find(x=>x.id===id);copy(t==='pass'?i.pass:i.user,t==='pass'?'Password':'Username')}
function edit(id){const i=items.find(x=>x.id===id)||{name:'',url:'',user:'',pass:'',cat:'Other',notes:'',fav:0};
 openSh(`<h3 style="margin-top:0">${id?'Edit':'New'} password</h3>
 <label>Name</label><input id="f1" value="${esc(i.name)}" placeholder="e.g. Netflix">
 <label>Website</label><input id="f2" value="${esc(i.url)}" placeholder="https://">
 <label>Username / Email</label><input id="f3" value="${esc(i.user)}" autocapitalize="off">
 <label>Password</label><div class="row"><input id="f4" type="password" value="${esc(i.pass)}" oninput="st()"><button class="sm" style="margin-top:5px;height:46px;width:46px" onclick="const e=$('#f4');e.type=e.type==='password'?'text':'password'">👁</button><button class="sm" style="margin-top:5px;height:46px;width:46px" onclick="$('#f4').value=gen();$('#f4').type='text';st()">🎲</button></div>
 <div class="bar"><i id="sb"></i></div><small id="sl" class="mut"></small>
 <label style="display:block;margin-top:10px">Category</label><select id="f5">${CATS.map(c=>`<option ${c===i.cat?'selected':''}>${c}</option>`).join('')}</select>
 <label>Notes</label><textarea id="f6" rows="3">${esc(i.notes)}</textarea>
 <div class="chk"><span>★ Favorite</span><input type="checkbox" id="f7" ${i.fav?'checked':''}></div>
 <div class="row" style="margin-top:8px">${id?'<button class="btn d" id="fd">Delete</button>':''}<button class="btn g" onclick="closeSh()">Cancel</button><button class="btn" id="fs">Save</button></div>`);
 st();
 $('#fs').onclick=async()=>{const n=$('#f1').value.trim();if(!n)return toast('Name required');const o={id:id||crypto.randomUUID(),name:n,url:$('#f2').value.trim(),user:$('#f3').value.trim(),pass:$('#f4').value,cat:$('#f5').value,notes:$('#f6').value,fav:$('#f7').checked?1:0,ts:Date.now()};
  id?items[items.findIndex(x=>x.id===id)]=o:items.push(o);await save();closeSh();render();toast('Saved')};
 if(id)$('#fd').onclick=async()=>{if(confirm('Delete this item?')){items=items.filter(x=>x.id!==id);await save();closeSh();render()}}}
function st(){const p=$('#f4').value,s=score(p);$('#sb').style.width=(p?(s+1)*20:0)+'%';$('#sl').textContent=p?SL[s]:''}

function health(){const w=items.filter(i=>score(i.pass)<=2),m={};items.forEach(i=>(m[i.pass]=m[i.pass]||[]).push(i));const re=items.filter(i=>m[i.pass].length>1),old=items.filter(i=>Date.now()-(i.ts||0)>15552000000),bad=new Set([...w,...re,...old]).size,pct=items.length?Math.round(100*(items.length-bad)/items.length):100;
 const Rw=(k,ic,t,sub,a)=>`<div class="item" onclick="hs=hs==='${k}'?'':'${k}';health()"><div class="av">${ic}${a.length?`<em class="bd">${a.length}</em>`:''}</div><div class="inf"><b>${t}</b><small>${sub}</small></div><span class="mut">›</span></div>`+(hs===k?a.map(i=>`<div class="item sub" onclick="edit('${i.id}')"><div class="inf"><b>${esc(i.name)}</b><small>${esc(i.user)}</small></div><span class="mut">✎</span></div>`).join(''):'');
 $('#view').innerHTML=`<h1 class="hero" style="font-size:34px">Password<br>Health</h1><div class="glass"><div class="inf"><b>Breach Monitoring</b><small>Check if your email or password was leaked.</small><div style="height:10px"></div><button class="btn" onclick="window.open('https://haveibeenpwned.com','_blank')">Check now</button></div><span style="font-size:48px;filter:grayscale(1)">📡</span></div><small>Password Health • ${pct}%</small><div class="bar big"><i style="width:${pct}%"></i></div>${Rw('w','🔓','Weak passwords','Change your passwords',w)}${Rw('r','🔁','Reused passwords','Generate unique passwords',re)}${Rw('o','⏳','Old passwords','Not changed in 6+ months',old)}`}

function settings(){const th=['violet','aurora','ocean','emerald','sunset','rose','gold','mono'],g={violet:'#7c5cff,#22d3ee',aurora:'#8e2de2,#00c9ff',ocean:'#2193b0,#6dd5ed',emerald:'#11998e,#38ef7d',sunset:'#ff5e62,#ff9966',rose:'#ee0979,#ff6a00',gold:'#f7971e,#ffd200',mono:'#8a8a94,#f4f4f6'};
 $('#view').innerHTML=`<div class="box"><b>Theme</b><div class="sw">${th.map(t=>`<i class="${document.documentElement.dataset.t===t?'on':''}" style="background:linear-gradient(135deg,${g[t]})" onclick="theme('${t}');settings()"></i>`).join('')}</div></div>
 <div class="box"><label>Auto-lock after inactivity</label><select onchange="setS('al',+this.value);bump()">${[[1,'1 min'],[5,'5 min'],[15,'15 min'],[60,'1 hour'],[0,'Never']].map(([v,t])=>`<option value="${v}" ${(S.al??5)===v?'selected':''}>${t}</option>`).join('')}</select>
 <div class="chk"><span>Lock when app is hidden</span><input type="checkbox" ${S.hl?'checked':''} onchange="setS('hl',this.checked)"></div>
 <div class="chk"><span>Clear clipboard after 30s</span><input type="checkbox" ${S.cc!==0?'checked':''} onchange="setS('cc',this.checked?1:0)"></div></div>
 <div class="box"><b>Backup</b><p class="mut" style="margin:6px 0 12px">Export file is encrypted. Password needed for export and import.</p><div class="row"><button class="btn g" onclick="exp()">⬆ Export</button><button class="btn g" onclick="$('#file').click()">⬇ Import</button></div></div>
 <div class="box"><b>Security</b><div class="row" style="margin-top:10px"><button class="btn g" onclick="chpw()">Change master password</button></div><div class="row" style="margin-top:10px"><button class="btn d" onclick="wipe()">Erase everything</button></div></div>
 <div class="box"><b>Install app</b><p class="mut" style="margin:6px 0 10px">Android/Chrome: tap ⬇ at top (or browser menu → Install app). iPhone: Share → Add to Home Screen. Host over HTTPS for best result.</p></div>`}

async function exp(){const p=await askPw('Enter password to export');if(!p)return;const o=await seal(items,p);const b=new Blob([JSON.stringify({app:'vaultx',v:1,...o})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vaultx-backup-'+new Date().toISOString().slice(0,10)+'.vaultx';a.click();toast('Exported')}
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!await askPw('Enter password to import'))return;
 try{const o=JSON.parse(await f.text());if(o.app!=='vaultx')throw 0;let d;try{d=await unseal(o,pw)}catch(x){const p2=await askPw('Backup password (if different)',false);if(!p2)return;d=await unseal(o,p2)}
  let n=0;d.forEach(i=>{if(!items.some(x=>x.name===i.name&&x.user===i.user)){i.id=crypto.randomUUID();items.push(i);n++}});await save();render();toast(n+' imported')}catch(x){toast('Import failed')}};
async function chpw(){if(!await askPw('Current password'))return;openSh(`<h3 style="margin-top:0">New master password</h3><input id="n1" type="password" placeholder="New password"><input id="n2" type="password" placeholder="Confirm"><div class="row"><button class="btn g" onclick="closeSh()">Cancel</button><button class="btn" id="nk">Change</button></div>`);
 $('#nk').onclick=async()=>{const a=$('#n1').value;if(a.length<6||a!==$('#n2').value)return toast('Min 6 chars & must match');pw=a;await save();closeSh();toast('Password changed')}}
async function wipe(){if(!await askPw('Password to erase all data'))return;if(confirm('PERMANENTLY delete all saved passwords? This cannot be undone.')){localStorage.removeItem('vx_v');lockNow()}}

// ---- PWA ----
try{const ic='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#7c5cff"/><text x="256" y="350" font-size="280" text-anchor="middle">🔐</text></svg>');
 const m={name:'VaultX',short_name:'VaultX',display:'standalone',background_color:'#0b0b0f',theme_color:'#0b0b0f',start_url:location.href.split('#')[0],icons:[{src:ic,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
 const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
 const a=document.createElement('link');a.rel='apple-touch-icon';a.href=ic;document.head.appendChild(a)}catch(e){}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;$('#inst').hidden=true}};
lockUI();
</script></body></html>
